<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#12213b">
    <title>wuyanzu · 项目导航</title>
    <link rel="stylesheet" href="/wuyanzu/styles.css">
    <script src="/wuyanzu/app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/wuyanzu/" aria-label="wuyanzu 项目导航首页">
          <span class="brand-mark" aria-hidden="true">W</span>
          <span>WUYANZU<span class="brand-subtitle">PROJECT ARCHIVE</span></span>
        </a>
        <span class="header-label">项目与版本归档</span>
      </div>
    </header>
    <main>
      <section class="intro" aria-labelledby="page-title">
        <div class="intro-copy">
          <p class="eyebrow">WORKSPACE / 项目空间</p>
          <h1 id="page-title">每个项目，每一次迭代。</h1>
          <p class="intro-description">选择项目，展开日期版本。让每一次更新，都有迹可循。</p>
        </div>
        <div class="stats" aria-label="项目统计">
          <div><strong>{{PROJECT_COUNT}}</strong><span>项目文件夹</span></div>
          <div><strong>{{VERSION_COUNT}}</strong><span>日期版本</span></div>
        </div>
      </section>
      <section class="project-section" aria-labelledby="projects-title">
        <div class="section-heading">
          <div><span class="section-number">01</span><h2 id="projects-title">全部项目</h2></div>
          <p>点击项目展开版本 <span aria-hidden="true">↓</span></p>
        </div>
        <div class="project-list">
          {{PROJECT_CARDS}}
        </div>
      </section>
      <footer>
        <p><span class="status-dot" aria-hidden="true"></span>与仓库同步 · 部署成功后自动更新</p>
        <span>WUYANZU / PROJECT ARCHIVE</span>
      </footer>
    </main>
  </body>
</html>
