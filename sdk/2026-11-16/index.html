<div class="workspace"><section class="product" aria-label="后台交互原型"><aside class="sidebar"><div class="brand"><i></i>AdControl</div><button data-nav="dashboard"><span>▤</span>数据概览</button><button data-nav="apps"><span>▣</span>白包APP</button><button data-nav="packages"><span>◈</span>B包管理</button><button data-nav="devices"><span>▥</span>设备管理</button><button data-nav="bots"><span>◎</span>Telegram 机器人</button><button data-nav="accounts"><span>♙</span>账户管理</button><button data-nav="roles"><span>◇</span>角色管理</button><div class="nav-label">本次新增</div><button data-nav="report"><span>▤</span>收益与投放报表</button><div class="side-note">桌面后台 · 交互原型<br>页面与数据均为模拟<br>不连接生产服务</div></aside><header class="app-top"><span id="breadcrumb">收益与投放报表</span><span><small>全部授权投放</small>　<span class="avatar">演</span>演示管理员</span></header><main class="content" id="main"></main><footer class="demo-bar"><span class="demo-label">原型演示工具</span><label>场景<select id="scenario" aria-label="演示场景"><option value="normal">正常</option><option value="loading">加载中</option><option value="empty">空数据</option><option value="error">查询失败</option><option value="pending">未就绪</option><option value="zero">零展示</option><option value="zeroActive">零活跃/异常</option><option value="readonly">只读权限</option></select></label><label><input type="checkbox" id="failNext">下次提交失败</label><button data-action="random">随机下发演示</button><button data-action="reset">重置演示</button><span class="muted">刷新页面复位 · 工具栏不进入生产</span></footer><div class="overlay" id="overlay" hidden></div><div class="toast" id="toast" role="status" hidden></div></section><aside class="rule-panel" aria-label="需求规则标注"><header class="rules-header"><h2>需求规则标注 <span class="badge">21条</span></h2><p>点击左侧编号定位规则；点击规则卡片反向定位界面。</p></header><div class="rules-list" id="rules"></div><div class="footer-links">仅蓝色编号及审阅工具属于原型辅助控件。</div></aside></div>
<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const number=v=>v===null||v===undefined?'—':Number(v).toLocaleString('en-US');
const money=v=>v===null||v===undefined?'—':'$'+Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const badge=(t,cls='')=>`<span class="badge ${cls}">${esc(t)}</span>`;
const mark=id=>`<button class="rule-mark" type="button" data-rule-id="${id}" title="查看规则 ${id}">${id}</button>`;
const RULES=[
['R-001','客服计数精简','agents','移除会话/上限、同时接待上限和关闭会话；保留今日分配、当日上限、在班和兜底。机器人计数时区不变。'],
['R-002','分配顺序与粘性','agents','7天老客回原启用客服；新客先看当日上限，优先在班，再按今日分配数、最后分配时间选择。会话数不参与任何筛选或排序。'],
['R-003','当日上限配置','agents','沿用现有客服权限；上限为1～999整数。修改上限不清零计数，保存失败保留输入。'],
['R-004','白包删除','apps','二次确认后从日常列表移除、停止新下发并解除有效关联；不删除关联B包。保留历史统计、归因和账目。'],
['R-005','B包删除','packages','仅归档当前投放，解除关联并停止参与新下发；白包和其他B包不受影响。历史素材归属及延迟事件可追溯。'],
['R-006','删除失败与取消','apps','确认显示名称/ID及影响。取消无变化，失败保留原记录。缓存按既有机制失效，不承诺离线SDK即时清空。'],
['R-007','广告来源隔离','apps','白包广告数据分自建广告/TopOn。TopOn按当前白包查询，不要求关联B包；B包入口仅展示自建投放范围。'],
['R-008','人均分母','apps','人均展示=有效展示次数÷对应白包同周期活跃人数。未看广告的人也计入分母。广告位筛选不缩减为广告观看人数。'],
['R-009','周期与去重','apps','展示统计UTC+5:30；按时/日/周/月重新去重。多日、周月或合计不能相加日活或平均人均值。'],
['R-010','缺失与零值','apps','展示0且活跃>0时人均为0；活跃为0时人均为—；未接入、历史缺失和查询失败均不能伪装成0。'],
['R-011','报表核算范围','report','收益与投放按UTC+0自然日、USD核算；按日期+白包+国家汇总。渠道仅保留消耗/安装明细，不拆分收益。'],
['R-012','消耗与收益计算','report','差额=收益−消耗；收益/消耗以百分比显示。消耗未录入、收益未就绪则派生值为—，消耗0时比值为—。'],
['R-013','投放数据录入','report','日期、白包、国家、渠道、消耗和安装数必填。消耗≥0，安装数为非负整数；日期和消耗对应UTC+0与USD。'],
['R-014','唯一性与修改','report','日期+白包+国家+渠道唯一。重复录入应修改原记录，不能叠加；修改保留审计信息。失败保留输入。'],
['R-015','收益同步','report','服务端拉取TopOn API收益，原型仅模拟。重复同步幂等覆盖，失败不覆盖有效值为0，保留成功时间和失败原因。'],
['R-016','收益完整性','report','缺授权、映射、币种不符或延迟时明确显示状态。预估收益不冒充API收益；部分收益不作为完整结果计算收支。'],
['R-017','历史保留与授权','report','归档对象的历史报表仍可查看；数据权限继续按原授权校验。只读不能录入、删除或修改配置。'],

function reportRows(){const keys=new Set([...S.costs,...S.revenues].map(x=>[x.date,x.app,x.country].join('|')));let rows=[...keys].map(k=>{const [date,app,country]=k.split('|'),costs=S.costs.filter(x=>x.date===date&&x.app===app&&x.country===country),r=S.revenues.find(x=>x.date===date&&x.app===app&&x.country===country);let cost=costs.length?costs.reduce((s,x)=>s+x.cost,0):null,rev=r?.revenue??null,status=r?.status||'missing';if(S.mode==='pending'){status='partial';}if(S.mode==='zero'){cost=0;rev=0;status='complete';}return{key:k,date,app,country,cost,installs:costs.length?costs.reduce((s,x)=>s+x.installs,0):null,revenue:rev,status,costs};});const f=S.filter;return rows.filter(r=>(!f.from||r.date>=f.from)&&(!f.to||r.date<=f.to)&&(!f.app||r.app===f.app)&&(!f.country||r.country===f.country)).sort((a,b)=>b.date.localeCompare(a.date)||a.app.localeCompare(b.app));}

all>${S.syncState==='failed'?'最近同步失败，已保留原值':'最近成功 '+S.sync+' UTC+0'}</small><button data-action="sync" ${readonly()}>重试同步</button>${mark('R-015')}</span></div>`+(stateBox()||`<div class="table-wrap" data-rule-anchor="R-016"><table><thead><tr><th>日期 / UTC+0</th><th>白包 / 国家</th><th class="num">消耗 USD</th><th class="num">安装数</th><th class="num">API收益 USD</th><th class="num">差额 USD</th><th class="num">收益/消耗</th><th>状态 ${mark('R-016')}</th><th>操作</th></tr></thead><tbody>${rows.map(r=>{const ok=r.status==='complete'&&r.revenue!==null&&r.cost!==null;return `<tr><td>${r.date}</td><td><strong>${appBy(r.app)?.name||r.app}</strong>${appBy(r.app)?.deleted?' '+badge('已删除','gray'):''}<span class="sub">${r.country==='IN'?'印度 IN':'阿联酋 AE'}</span></td><td class="num">${money(r.cost)}${r.cost===null?'<span class="sub">未录入</span>':''}</td><td class="num">${number(r.installs)}</td><td class="num">${money(r.revenue)}${r.status==='partial'?'<span class="sub">部分数据，不参与差额</span>':''}</td><td class="num ${ok?(r.revenue-r.cost>=0?'positive':'negative'):''}">${ok?money(r.revenue-r.cost):'—'}</td><td class="num">${ok&&r.cost>0?(r.revenue/r.cost*100).toFixed(2)+'%':'—'}</td><td>${badge(statusLabel(r.status),r.status==='complete'?'green':'orange')}</td><td><button class="link" data-action="cost-detail" data-key="${r.key}">投放明细</button></td></tr>`;}).join('')||'<tr><td colspan="9">当前条件无报表记录</td></tr>'}</tbody></table></div><div class="table-note"><span>共 ${rows.length} 组 · 同一收益只计入汇总一次</span><span>历史白包保留账目</span></div>`)+`<div class="explain" data-rule-anchor="R-017">${mark('R-017')} 已删除白包的历史统计保留；所有查看及录入均按原授权范围校验。<br><span data-rule-anchor="R-020">${mark('R-020')} 未就绪≠0；只读账号不能录入或同步；底部可切换状态进行验收。</span></div>`;}

async function commit(button,fn){if(S.mode==='readonly'){toast('只读账号，无修改权限');return;}button.disabled=true;const old=button.textContent;button.textContent='处理中…';const fail=$('#failNext').checked;$('#failNext').checked=false;await new Promise(r=>setTimeout(r,300));if(!button.isConnected)return;if(fail){button.disabled=false;button.textContent=old;const e=$('#dialogError');if(e)e.textContent=(dialog?.type==='delete'?'删除':'保存')+'失败，请重试；原有数据未改变。';else toast('同步失败，原有有效收益已保留');return false;}fn();return true;}

function openCostDetail(key){const row=reportRows().find(r=>r.key===key);if(!row)return;dialog={type:'cost-detail',key};showDialog('投放明细 · '+esc(appBy(row.app)?.name),`<p class="subtitle">${row.date} UTC+0 · ${row.country} · USD　${badge('渠道不分摊收益')}</p><div class="notice">本组API收益 ${money(row.revenue)}，仅在汇总计算一次。${row.status!=='complete'?'当前收益未完整，暂不计算差额。':''}</div><div class="table-wrap"><table><thead><tr><th>渠道</th><th class="num">消耗 USD</th><th class="num">安装数</th><th>最近修改</th><th>操作</th></tr></thead><tbody>${row.costs.map(c=>`<tr><td>${esc(c.channel)}</td><td class="num">${money(c.cost)}</td><td class="num">${c.installs}</td><td>${c.modified?'演示管理员 · 本次修改':'演示导入'}</td><td><button class="link" data-action="cost-edit" data-id="${c.id}" ${readonly()}>修改</button></td></tr>`).join('')||'<tr><td colspan="5">尚未录入投放消耗</td></tr>'}</tbody></table></div>`,`<button data-action="modal-close">关闭</button><button class="primary" data-action="cost-new-seed" data-key="${row.key}" ${readonly()}>录入本组投放</button>`,true);}
const days=['2026-11-14','2026-11-15','2026-11-16'],slots={open:'开屏',banner:'横幅',interstitial:'插屏',rewarded:'激励'};

function openStats(kind,id,keep=false){if(!keep)S.stats={kind,id,source:'custom',campaign:kind==='campaign'?Number(id):(S.campaigns.find(c=>!c.deleted&&c.apps.includes(id))?.id??null),app:kind==='app'?id:'',gran:'day',from:'2026-11-14',to:'2026-11-16',slots:Object.keys(slots),status:'normal'};const st=S.stats;dialog={type:'stats'};const name=kind==='app'?appBy(id)?.name:campBy(id)?.name;showDialog('广告数据 · '+esc(name),`<div class="notice" data-rule-anchor="R-007">范围：${kind==='app'?'仅当前白包归属广告数据':'当前投放及其对应白包范围'} · 印度时间 UTC+5:30 ${mark('R-007')}</div>${kind==='app'?`<div class="tabs"><button data-action="source" data-value="custom" class="${st.source==='custom'?'active':''}">自建广告</button><button data-action="source" data-value="topon" class="${st.source==='topon'?'active':''}">TopOn</button></div>`:''}<div class="filters">${st.source==='custom'&&kind==='app'?`<label>关联投放<select id="statCampaign">${S.campaigns.filter(c=>!c.deleted&&c.apps.includes(id)).map(c=>`<option value="${c.id}">${c.name} #${c.id}</option>`).join('')||'<option value="">暂无关联投放</option>'}</select></label>`:''}${kind==='campaign'?`<label>对应白包<select id="statApp"><option value="">全部对应白包</option>${(campBy(id)?.historyApps||[]).map(a=>`<option value="${a}">${appBy(a)?.name}</option>`).join('')}</select></label>`:''}<label>开始日期<input type="date" id="statFrom" value="${st.from}"></label><label>结束日期<input type="date" id="statTo" value="${st.to}"></label><label>粒度<select id="statGran"><option value="hour">时</option><option value="day">日</option><option value="week">周</option><option value="month">月</option></select></label><button class="primary" data-action="stats-update">更新</button></div><div class="slot-options">${Object.entries(slots).map(([k,v])=>`<button class="${st.slots.includes(k)?'selected':''}" data-action="slot" data-value="${k}" aria-pressed="${st.slots.includes(k)}">${v}广告</button>`).join('')}</div><div class="explain" data-rule-anchor="R-008">人均展示＝展示次数÷对应白包同周期活跃人数，包含未看广告的用户。${mark('R-008')}</div><div id="statResults"></div><p class="explain" data-rule-anchor="R-010">${mark('R-010')} 原型展示事件为模拟账本；历史缺失、失败和未接入不按0处理。</p>`,`<button data-action="modal-close">关闭</button>`,true);$('#statGran').value=st.gran;if($('#statCampaign'))$('#statCampaign').value=String(st.campaign??'');if($('#statApp'))$('#statApp').value=st.app;renderStatsResults();}
function bucket(x,gran){if(gran==='hour')return x.date+' '+String(x.hour).padStart(2,'0')+':00';if(gran==='month')return x.date.slice(0,7);if(gran==='week'){const d=new Date(x.date+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));return d.toISOString().slice(0,10)+' 周';}return x.date;}
function statData(){const t=S.stats,apps=t.kind==='app'?[t.id]:(t.app?[t.app]:(campBy(t.id)?.historyApps||[]));const time=x=>x.date>=t.from&&x.date<=t.to&&apps.includes(x.app);const a=activity.filter(time);let ev=events.filter(x=>time(x)&&x.source===t.source&&t.slots.includes(x.slot)&&(t.source==='topon'||x.campaign===Number(t.campaign)));const keys=new Set(a.map(x=>bucket(x,t.gran)));for(const e of ev)keys.add(bucket(e,t.gran));return [...keys].sort().map(key=>{const users=new Set(a.filter(x=>bucket(x,t.gran)===key).map(x=>x.user)),es=ev.filter(x=>bucket(x,t.gran)===key);let n=es.length,active=S.mode==='zeroActive'?0:users.size;if(S.mode==='zero')n=0;return{key,n,active,per:active?n/active:null,click:Math.floor(n*.09),people:new Set(es.map(e=>e.user)).size};});}
function renderStatsResults(){const t=S.stats,box=$('#statResults');if(!box)return;if(S.mode==='pending'){box.innerHTML='<div class="empty"><h3>展示数据未就绪</h3><p>当前时间范围尚无可靠上报。请核对接入版本及覆盖起点。</p></div>';return;}if(['error','loading','empty'].includes(S.mode)){box.innerHTML=stateBox();return;}if(t.source==='custom'&&!t.campaign){box.innerHTML='<div class="empty"><h3>暂无关联投放</h3><p>自建广告无可查询投放；可切换TopOn查看白包广告统计。</p></div>';return;}const data=statData(),kind=campBy(t.campaign)?.kind,show=data.reduce((s,r)=>s+r.n,0);const apps=t.kind==='app'?[t.id]:(t.app?[t.app]:(campBy(t.id)?.historyApps||[]));const totalActive=S.mode==='zeroActive'?0:new Set(activity.filter(x=>apps.includes(x.app)&&x.date>=t.from&&x.date<=t.to).map(x=>x.user)).size;box.innerHTML=(S.mode==='zeroActive'?'<div class="notice warn">数据异常：有展示但对应白包活跃人数为0，人均展示显示“—”，请核对上报与统计范围。</div>':'')+`<div class="cards" style="grid-template-columns:repeat(3,1fr)"><div class="card"><div class="metric-label">展示次数</div><div class="metric-value">${number(show)}</div></div><div class="card"><div class="metric-label">周期活跃人数 · 去重</div><div class="metric-value">${number(totalActive)}</div></div><div class="card"><div class="metric-label">周期人均展示 · 次/人</div><div class="metric-value">${totalActive?(show/totalActive).toFixed(2):'—'}</div></div></div><div class="table-wrap"><table><thead><tr><th>时间桶</th><th>广告位</th><th class="num">展示次数</th><th class="num">白包活跃人数</th><th class="num">人均展示</th>${t.source==='custom'?`<th class="num">点击</th><th class="num">${kind==='cs'?'建联人数 总/老/新':'付费人数 总/老/新'}</th>${kind==='b'?'<th class="num">B包安装</th><th class="num">付费金额</th>':''}`:''}</tr></thead><tbody>${data.map((r,i)=>`<tr><td>${r.key}</td><td>${t.slots.length===4?'全部广告位':t.slots.map(x=>slots[x]).join(' / ')}</td><td class="num">${number(r.n)}</td><td class="num">${number(r.active)}</td><td class="num">${r.per===null?'—':r.per.toFixed(2)}</td>${t.source==='custom'?`<td class="num">${r.click}</td><td class="num">${r.n?kind==='cs'?'5/2/3':'4/1/3':'0/0/0'}</td>${kind==='b'?`<td class="num">${r.n?12:0}</td><td class="num">${money(r.n?8:0)}</td>`:''}`:''}</tr>`).join('')||'<tr><td colspan="9">选定周期内无可靠数据，原型模拟覆盖2026-11-14至16日</td></tr>'}</tbody></table></div><div class="notice" data-rule-anchor="R-009">周/月及区间活跃人数从用户集合重新去重，不相加日活；广告位切换不改变同周期活跃分母。${mark('R-009')}</div>${trend(data)}`;}
function trend(data){if(!data.length)return '';const rows=data.slice(0,12),max=Math.max(...rows.map(x=>x.n),1),points=rows.map((r,i)=>`${55+i*(640/Math.max(rows.length-1,1))},${115-r.n/max*85}`).join(' ');return `<div class="plot"><h4>展示次数趋势 <span class="chart-key">● ${S.stats.source==='topon'?'TopOn':'自建广告'} · 同当前筛选</span></h4><svg viewBox="0 0 740 150" role="img" aria-label="展示次数趋势图"><path d="M55 22V115H705 M55 72H705 M55 29H705" stroke="#3b485f" fill="none"/><text x="10" y="119">0</text><text x="8" y="32">${max}</text><polyline points="${points}" fill="none" stroke="#679ffe" stroke-width="2"/>${rows.map((r,i)=>`<circle cx="${55+i*(640/Math.max(rows.length-1,1))}" cy="${115-r.n/max*85}" r="3" fill="#98baff"/><text text-anchor="middle" x="${55+i*(640/Math.max(rows.length-1,1))}" y="140">${esc(r.key.slice(-8))}</text>`).join('')}</svg></div>`;}
function openRandom(){dialog={type:'random'};const offers=[{id:201,country:'IN',category:'app',kind:'cs',slot:'interstitial',bid:1,eligible:true},{id:202,country:'IN',category:'app',kind:'cs',slot:'interstitial',bid:1,eligible:true},{id:203,country:'IN',category:'app',kind:'cs',slot:'interstitial',bid:.5,eligible:false},{id:204,country:'AE',category:'app',kind:'cs',slot:'interstitial',bid:1,eligible:false}];showDialog('服务端随机下发 · 辅助演示',`<div class="notice" data-rule-anchor="R-018">当前请求：印度 IN · 标识 app · 客服建联 · 插屏。合格最高价同价池内随机取1条。${mark('R-018')}</div><div class="table-wrap"><table><thead><tr><th>素材ID</th><th>地区</th><th>价格</th><th>候选判断</th><th class="num">本轮累计命中</th></tr></thead><tbody>${offers.map(o=>`<tr><td>#${o.id}</td><td>${o.country}</td><td>$${o.bid.toFixed(2)}</td><td>${o.eligible?badge('随机候选','green'):badge(o.id===203?'价格较低':'地区不匹配','gray')}</td><td class="num">${S.randomCounts[o.id]??0}</td></tr>`).join('')}</tbody></table></div><div class="notice" data-rule-anchor="R-019">返回每个广告位一个对象，不改数组。这里只模拟抽样，不调用生产接口，不保证短期均分。${mark('R-019')}</div><pre id="randomResponse">${S.randomResult?esc(JSON.stringify(S.randomResult,null,2)):'点击下方“模拟请求一次”查看响应'}</pre>`,`<button data-action="modal-close">关闭</button><button data-action="random-batch">模拟请求100次</button><button class="primary" data-action="random-one">模拟请求一次</button>`,true);}
function selectRule(id,reverse=false){const rule=RULES.find(r=>r[0]===id);if(!rule)return;if(reverse){if(['R-018','R-019'].includes(id)){openRandom();}else if(['R-007','R-008','R-009','R-010'].includes(id)){S.page='apps';render();openStats('app','a1');}else if(['R-013','R-014'].includes(id)){S.page='report';render();setReportSelectors();openCost();}else{closeDialog();S.page=rule[2];S.mode='normal';$('#scenario').value='normal';render();setReportSelectors();}}$$('.rule-focus').forEach(x=>x.classList.remove('rule-focus'));$$('.rule-card').forEach(x=>x.classList.toggle('active',x.dataset.ruleTarget===id));const card=$('#rule-'+id);card?.scrollIntoView({block:'nearest',behavior:'smooth'});const anchor=$(`[data-rule-anchor="${id}"]`);if(anchor){anchor.classList.add('rule-focus');if(reverse)anchor.scrollIntoView({block:'nearest',behavior:'smooth'});}else{const marker=$(`[data-rule-id="${id}"]`);marker?.classList.add('rule-focus');marker?.scrollIntoView({block:'nearest'});}}

function openMaterialForm(campaign,id=null){const c=campBy(campaign),m=id?c.materials.find(x=>x.id===Number(id)):null;dialog={type:'material-form',campaign:c.id,id:m?.id??null};showDialog(m?'编辑广告':'新增广告',`<div class="notice">${legacy()} 原有素材编辑；本次不新增素材字段或改定向规则。</div><form id="materialForm"><div class="form-grid"><label>广告类型<select id="materialType">${Object.entries(slots).map(([k,v])=>`<option value="${k}"${selected(m?.type,k)}>${v}广告</option>`).join('')}</select></label><label>素材<input type="file" accept="image/*,video/*" aria-label="上传素材"><span class="form-help">现有上传与预览能力保留，原型不实际上传。</span></label><label class="full">跳转URL<input id="materialJump" value="${esc(m?.jump||'')}" placeholder="请输入跳转URL"></label>${c.kind==='cs'?`<label>国家<select id="materialCountry" multiple>${countryOptions(false)}</select><span class="form-help">不选表示全球。</span></label>`:''}<label>出价金额<input id="materialBid" type="number" min="0" step="0.01" value="${m?.bid??0}"></label><label>状态<select id="materialState"><option${selected(m?.state,'启用')}>启用</option><option${selected(m?.state,'停用')}>停用</option></select></label></div><div id="dialogError" class="error-text" role="alert"></div></form>`,`<button data-action="material-back" data-id="${c.id}">取消</button><button class="primary" data-action="material-save">确定</button>`);if($('#materialCountry')){const countries=m?.countries||[];[...$('#materialCountry').options].forEach(o=>o.selected=countries.includes(o.value));}}

openStats=function(kind,id,keep=false){prevOpenStats(kind,id,keep);$('#dialogTitle').textContent='数据详情 - '+(kind==='app'?appBy(id)?.name:campBy(id)?.name);const head=$('#overlay .modal-body');head.insertAdjacentHTML('afterbegin','<p class="preservation-caption">现有统计字段、列顺序和趋势指标全部保留；绿色标记为本次新增。TopOn为新增来源分区。</p>');const t=S.stats;if(t.source==='custom'){const sel=$('#statCampaign');if(sel){sel.closest('label').firstChild.textContent='事件关联 B 包';}else{const c=campBy(t.campaign);head.querySelector('.filters').insertAdjacentHTML('beforebegin',`<div class="explain">事件关联 B 包：${esc(c?.pkg||c?.name||'—')}　${badge(c?.kind==='cs'?'客服建联':'应用拉活')}</div>`);}}};
renderStatsResults=function(){const t=S.stats,box=$('#statResults');if(!box)return;if(S.mode==='pending'){box.innerHTML='<div class="empty"><h3>展示数据未就绪</h3><p>当前范围尚无可靠数据，不将缺失填0。</p></div>';return;}if(['error','loading','empty'].includes(S.mode)){box.innerHTML=stateBox();return;}if(t.source==='custom'&&!t.campaign){box.innerHTML='<div class="empty">当前白包暂无关联投放，自建广告无法查询。TopOn统计不受此关联限制。</div>';return;}const data=statData(),kind=campBy(t.campaign)?.kind,custom=t.source==='custom',rows=data.map(r=>({...r,install:r.n?12:0,amount:r.n?8:0,connect:r.n?5:0,paid:r.n?4:0})),show=rows.reduce((s,r)=>s+r.n,0),apps=t.kind==='app'?[t.id]:(t.app?[t.app]:(campBy(t.id)?.historyApps||[])),active=S.mode==='zeroActive'?0:new Set(activity.filter(x=>apps.includes(x.app)&&x.date>=t.from&&x.date<=t.to).map(x=>x.user)).size;const oldHeads=custom?(kind==='cs'?['日期','广告位','展示','点击','建联人数（总/老/新）']:['日期','广告位','安装','展示','点击','付费金额','付费人数（总/老/新）']):['日期','广告位','展示'];box.innerHTML=(S.mode==='zeroActive'?'<div class="notice warn">数据异常：有展示但对应白包活跃人数为0，人均展示显示“—”。</div>':'')+`<div class="cards" style="grid-template-columns:repeat(3,1fr)"><div class="card"><div class="metric-label">${custom?'展示次数（原有）':'TopOn展示次数'}</div><div class="metric-value">${number(show)}</div></div><div class="card"><div class="metric-label">周期活跃人数 ${added()}</div><div class="metric-value">${number(active)}</div></div><div class="card"><div class="metric-label">人均展示次数 ${added()}</div><div class="metric-value">${active?(show/active).toFixed(2):'—'}</div></div></div><div class="table-wrap preserved-table stats-table" data-baseline="${custom?(kind==='cs'?'statsCS':'statsB'):'statsTopOn'}"><table><thead><tr>${oldHeads.map(h=>`<th>${h}</th>`).join('')}<th>白包活跃人数 ${added()}</th><th>人均展示次数 ${added()}</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.key}</td><td>${t.slots.length===4?'全部广告位':t.slots.map(x=>slots[x]).join(' / ')}</td>${custom&&kind==='b'?`<td class="num">${r.install}</td>`:''}<td class="num">${number(r.n)}</td>${custom?`<td trend=function(data){if(!data.length)return '';const t=S.stats,kind=campBy(t.campaign)?.kind,custom=t.source==='custom';const defs=custom?(kind==='cs'?[['n','展示','#72a9ff'],['click','点击','#eda961'],['connect','建联人数','#77d1ab']]:[['install','安装','#b9a3ed'],['n','展示','#72a9ff'],['click','点击','#eda961'],['amount','付费金额','#77d1ab']]):[['n','展示','#72a9ff']];defs.push(['active','白包活跃人数','#d9ca78'],['per','人均展示次数','#d58dc5']);t.visibleMetrics??=defs.map(x=>x[0]);const visible=defs.filter(d=>t.visibleMetrics.includes(d[0])),rows=data.slice(0,12);let svg='';for(const [idx,[key,label,color]]of visible.entries()){const values=rows.map(x=>Number(x[key])||0),max=Math.max(...values,1),points=values.map((v,i)=>`${65+i*(625/Math.max(rows.length-1,1))},${111-v/max*72}`).join(' ');svg+=`<polyline points="${points}" fill="none" stroke="${color}" stroke-width="2"/>`;if(idx===0)svg+=`<text x="5" y="28">${max.toFixed(max<10?2:0)}</text>`;}return `<div class="plot"><h4>趋势曲线 <span class="muted">原有指标开关保留；各指标独立归一化，示意趋势，数值以表格为准。</span></h4><div class="trend-toggles">${defs.map(([k,label,color])=>`<button data-action="trend-toggle" data-key="${k}" class="${t.visibleMetrics.includes(k)?'selected':''}" style="--metric-color:${color}"><span style="color:${color}">●</span> ${label}${['active','per'].includes(k)?' '+added():''}</button>`).join('')}</div><svg viewBox="0 0 740 150" role="img" aria-label="当前筛选指标趋势图"><path d="M65 28V111H705 M65 72H705" stroke="#3b485f" fill="none"/><text x="10" y="115">0</text>${svg}${rows.map((r,i)=>`<text text-anchor="middle" x="${65+i*(625/Math.max(rows.length-1,1))}" y="140">${esc(r.key.slice(-8))}</text>`).join('')}</svg></div>`;};
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='existing-app-new')openExistingForm('app');if(a==='existing-app-edit')openExistingForm('app',b.dataset.id);if(a==='existing-campaign-new')openExistingForm('campaign');if(a==='existing-campaign-edit')openExistingForm('campaign',Number(b.dataset.id));if(a==='existing-materials')openMaterials(Number(b.dataset.id));if(a==='material-new')openMaterialForm(Number(b.dataset.id));if(a==='material-edit')openMaterialForm(Number(b.dataset.campaign),Number(b.dataset.id));if(a==='material-back')openMaterials(Number(b.dataset.id));if(a==='material-remove'){const cid=Number(b.dataset.campaign),id=Number(b.dataset.id);existingConfirm('删除广告确认','沿用原有广告素材删除规则，其他素材保持。',()=>{campBy(cid).materials.find(m=>m.id===id).deleted=true;openMaterials(cid);});}if(a==='existing-confirm'){const fn=dialog.fn;await commit(b,()=>{closeDialog();fn();});}if(a==='existing-save'){const f=$('#existingForm');if(!f.reportValidity())return;const d={...dialog},data={};f.querySelectorAll('[data-existing]').forEach(x=>{data[x.dataset.existing]=x.multiple?[...x.selectedOptions].map(o=>o.value):x.value;});if(data.category!==undefined)data.category=data.category.trim();await commit(b,()=>{if(d.kind==='app'){let item=d.id?appBy(d.id):null;if(!item){item={id:'a'+(S.apps.length+1),displayId:S.apps.length+1,installs:0,active:0,show:0,click:0,pay:0,connect:0,deleted:false};S.apps.push(item);}const oldId=item.id;Object.assign(item,data,{id:oldId});item.freq={};f.querySelectorAll('[data-freq]').forEach(x=>{item.freq[x.dataset.freq]??=[];item.freq[x.dataset.freq][Number(x.dataset.freqPart)]=Number(x.value);});}else{let item=d.id?campBy(d.id):null;if(!item){item={id:Math.max(100,...S.campaigns.map(x=>x.id))+1,deleted:false,materials:[],created:'2026-11-16 10:00:00'};S.campaigns.push(item);}Object.assign(item,data);item.historyApps=[...new Set([...(item.historyApps||[]),...item.apps])];}close
